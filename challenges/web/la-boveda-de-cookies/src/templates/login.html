<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberVault - Bóveda Digital Segura</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #060913;
            --card-bg: rgba(15, 23, 42, 0.85);
            --border-glow: rgba(56, 189, 248, 0.25);
            --accent-cyan: #38bdf8;
            --accent-indigo: #818cf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, var(--bg-base) 80%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-glow);
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 25px rgba(56, 189, 248, 0.08);
            position: relative;
        }

        .vault-icon {
            text-align: center;
            font-size: 38px;
            margin-bottom: 12px;
        }

        h2 {
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #ffffff 0%, var(--accent-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.desc {
            color: var(--text-muted);
            font-size: 13px;
            text-align: center;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #cbd5e1;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            background: rgba(2, 6, 23, 0.8);
            border: 1px solid #334155;
            border-radius: 8px;
            color: #f8fafc;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.25);
        }

        button {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            margin-top: 10px;
        }

        button:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }

        .error-box {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--danger);
            color: #fca5a5;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            text-align: center;
        }

        .guest-hint {
            margin-top: 25px;
            background: rgba(30, 41, 59, 0.6);
            border: 1px dashed #475569;
            border-radius: 8px;
            padding: 14px;
            font-size: 12px;
            color: #94a3b8;
            font-family: 'Fira Code', monospace;
        }

        .guest-hint strong {
            color: var(--accent-cyan);
            display: block;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="vault-icon">🔐</div>
        <h2>CyberVault Portal</h2>
        <p class="desc">Bóveda de Almacenamiento Criptográfico Seguro</p>

        {% if error %}
            <div class="error-box">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="form-group">
                <label for="username">Usuario:</label>
                <input type="text" id="username" name="username" placeholder="Ingresa tu usuario" required autocomplete="off">
            </div>
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit">Desbloquear Sesión</button>
        </form>

        <div class="guest-hint">
            <strong>Credenciales de prueba / Acceso Invitado:</strong>
            Usuario: <code>invitado</code><br>
            Password: <code>invitado123</code>
        </div>
    </div>
</body>
</html>
