name: "Comandos Ocultos"
author: "Chronos Security Team"
category: "web"
description: |
  **PingTool Pro** es una utilidad interna desarrollada por el equipo de redes para diagnosticar la conectividad de los servidores.
  
  Los administradores afirman que su nuevo WAF perimetral bloquea cualquier intento de inyección de comandos en el sistema.
  
  ¿Serás capaz de eludir las restricciones del filtro y recuperar el contenido secreto del archivo `/flag`?
  
  **Servicio expuesto:** `http://<TARGET_IP>:8005`

value: 500
type: standard

