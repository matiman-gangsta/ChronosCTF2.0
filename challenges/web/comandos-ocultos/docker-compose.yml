
services:
  comandos-ocultos:
    build: .
    image: comandos-ocultos:latest
    container_name: chronos_challenge_comandos_ocultos
    ports:
      - "8005:5000"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M
    pids_limit: 50
