# Directorio de cargas: el listado queda desactivado, pero los archivos se
# pueden solicitar directamente si el estudiante descubre su ubicación.
<Directory "/var/www/html/attachments">
    Options -Indexes
    AllowOverride None
    Require all granted

    # Error intencional del reto: .conf recibe el handler de PHP.
    <FilesMatch "\.conf$">
        SetHandler application/x-httpd-php
    </FilesMatch>
</Directory>
