<VirtualHost *:80>
    ServerName public.nightfall.local
    DocumentRoot /var/www/public

    <Directory /var/www/public>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:80>
    ServerName console.nightfall.local
    DocumentRoot /var/www/console

    <Directory /var/www/console>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
