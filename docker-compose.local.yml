services:
  gzctf:
    image: gztime/gzctf:latest
    container_name: chronos_gzctf_local
    restart: always
    environment:
      - GZCTF_ADMIN_PASSWORD=AdminPassword123!
    ports:
      - "8888:8080"
    volumes:
      - ./gzctf/appsettings.json:/app/appsettings.json:ro
      - gzctf_files:/app/files
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - ctf_local
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: chronos_postgres_local
    restart: always
    environment:
      - POSTGRES_DB=gzctf
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_local_password
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - ctf_local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gzctf"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  gzctf_files:
  pg_data:

networks:
  ctf_local:
    name: chronos_network_local
    driver: bridge
